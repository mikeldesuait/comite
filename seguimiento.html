<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acta de Seguimiento - Plan de Igualdad</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        @media print {
            body { background: #fff; font-size: 12px; color: #000; }
            .no-print { display: none !important; }
            .container { max-width: 100%; padding: 0; }
            .card { box-shadow: none; border: 1px solid #000; }
        }
        .form-group { margin-bottom: 1rem; }
        .hallazgo-card { background: #fff5f5; border-left: 4px solid #c62828; padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container" style="margin-top: 2rem; margin-bottom: 2rem;">
        
        <div class="no-print" style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
            <a href="cumplimiento.html" class="btn" style="background: #757575;">⬅️ Volver a Pasos</a>
            <button onclick="window.print()" class="btn btn-primary">🖨️ Imprimir / Guardar como PDF</button>
        </div>

        <!-- Formulario para rellenar antes de imprimir (se oculta al imprimir) -->
        <div class="no-print card" id="formularioSeguimiento" style="padding: 1.5rem; margin-bottom: 2rem;">
            <h3 style="margin-bottom: 1rem; color: var(--primary-dark);">📝 Rellenar datos del acta</h3>
            <div class="form-group">
                <label>Fecha de la reunión de hoy</label>
                <input type="date" id="fechaHoy" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; width: 100%;">
            </div>
            <div class="form-group">
                <label>Fecha de la próxima reunión programada</label>
                <input type="date" id="fechaProxima" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; width: 100%;">
            </div>
            <div class="form-group">
                <label>Puntos tratados y acuerdos alcanzados</label>
                <textarea id="textoAcuerdos" rows="3" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; width: 100%; font-family: inherit;" placeholder="Ej: Se revisa el estado del plan. La empresa se compromete a entregar las nóminas..."></textarea>
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 10px; background: #ffebee; padding: 10px; border-radius: 4px; border: 1px solid #ef9a9a;">
                <input type="checkbox" id="checkAdvertencia" style="width: 20px; height: 20px; cursor: pointer;">
                <label for="checkAdvertencia" style="cursor: pointer; color: #c62828; font-weight: bold; margin: 0;">
                    Incluir cláusula de advertencia legal (Dejar constancia de incumplimiento)
                </label>
            </div>
            <button type="button" class="btn btn-primary" onclick="window.generarActa()">Generar Documento</button>
        </div>

        <!-- El documento final (aquí se inyecta el HTML con JS) -->
        <div id="documentoActa" style="display: none;">
            <!-- Contenido -->
        </div>

    </div>

    <script src="js/modelo.js"></script>
    <script src="js/seguimiento.js"></script>
</body>
</html>
