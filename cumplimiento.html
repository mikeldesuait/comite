<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumplimiento Normativo - Plan de Igualdad</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div style="display:flex; justify-content:space-between; align-items:center; width:100%; flex-wrap: wrap;">
                <h1>📋 Gestor de Plan de Igualdad</h1>
                
                <!-- Botón hamburguesa (solo móvil) -->
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menú">☰</button>
            </div>

            <!-- Contenedor de la navegación que se colapsa en móvil -->
            <div class="nav-container" id="navContainer">
                <div class="header-tools">
                    <div class="demo-badge" id="demoBadge" style="display:none;" title="Los datos actuales son de ejemplo. Se quitará al guardar datos propios.">
                        🎭 Modo DEMO
                    </div>
                    <div class="user-selector" id="userSelector">
                        <span class="user-label">👤 Trabajando como:</span>
                        <select id="usuarioActualSelect" title="Selecciona quién está trabajando">
                            <option value="">— Selecciona —</option>
                        </select>
                    </div>
                </div>
                
                <nav id="mainNav"></nav>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="page-title">
            <h2>✅ Cumplimiento Normativo</h2>
            <p>Checklist completo de los pasos exigidos por el RD 901/2020 y RD 902/2020. Marca cada paso a medida que lo completes.</p>
        </section>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p id="progressText" class="progress-text">0 de 0 pasos completados (0%)</p>

        <div id="fasesContainer"></div>

        <div class="form-actions" style="margin-top:3rem; justify-content: center;">
            <button type="button" id="btnResetCumplimiento" class="btn btn-danger" style="background:transparent; color:#ccc; border: 1px solid #ccc; font-size: 0.8rem;">🗑️ Reiniciar todo el checklist (Cuidado)</button>
        </div>

        <div id="statusMessage" class="status-message"></div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Gestor de Plan de Igualdad</p>
    </footer>

    <style>
        .fase-card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 1.5rem; overflow: hidden; }
        .fase-header { padding: 1rem 1.5rem; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .fase-header h3 { margin: 0; font-size: 1.1rem; }
        .fase-header .fase-progress { font-size: 0.85rem; background: rgba(255,255,255,0.2); padding: 0.25rem 0.7rem; border-radius: 12px; }
        .fase-body { padding: 0; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .fase-body.open { max-height: 2000px; }
        .paso-item { display: flex; align-items: flex-start; gap: 0.8rem; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); transition: background 0.2s; }
        .paso-item:last-child { border-bottom: none; }
        .paso-item:hover { background: #fafafa; }
        .paso-item.completado { background: #f1f8e9; }
        .paso-checkbox { width: 20px; height: 20px; margin-top: 2px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
        .paso-content { flex: 1; }
        .paso-titulo { font-weight: 600; color: var(--text); margin-bottom: 0.2rem; }
        .paso-item.completado .paso-titulo { text-decoration: line-through; color: var(--text-light); }
        .paso-descripcion { font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.3rem; }
        .paso-referencia { font-size: 0.8rem; color: var(--primary); font-style: italic; }
        .paso-porque { font-size: 0.85rem; color: #6b6b6b; margin-top: 0.3rem; padding: 0.4rem 0.6rem; background: #f5f5f7; border-left: 3px solid var(--secondary); border-radius: 4px; }
        .progress-bar-container { width: 100%; height: 12px; background: #e0e0e0; border-radius: 6px; margin: 1rem 0 0.5rem; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%); transition: width 0.4s ease; border-radius: 6px; }
        .progress-text { font-size: 0.9rem; color: var(--text-light); margin-bottom: 1.5rem; }
    </style>

    <script src="js/archivos-db.js"></script>
    <script src="js/modelo.js"></script>
    <script src="js/cumplimiento-render.js"></script>
    <script src="js/cumplimiento.js"></script>
    <script src="js/usuario-selector.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/seed-loader.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/toast.js"></script>
</body>
</html>
