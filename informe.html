<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Final - Plan de Igualdad</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        @media print {
            body { background: #fff; font-size: 12px; color: #000; }
            .no-print { display: none !important; }
            .container { max-width: 100%; padding: 0; }
            .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
            h1, h2, h3 { color: #000 !important; }
            .seccion { page-break-inside: avoid; }
        }
        .header-print { text-align: center; margin-bottom: 2rem; border-bottom: 2px solid #000; padding-bottom: 1rem; }
        .header-print h1 { color: #000; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="container" style="margin-top: 2rem; margin-bottom: 2rem;">
        <div class="no-print" style="text-align: right; margin-bottom: 1rem;">
            <button type="button" class="btn" style="background:#1976d2; color:white;" onclick="document.getElementById('inputImportarInforme').click()">📥 Importar Informe para firmar</button>
            <input type="file" id="inputImportarInforme" accept=".json" style="display:none;" onchange="window.importarInformeParaFirmar(event)">
        </div>
        <div id="informeContenido">
            <!-- Se llena con JS -->
        </div>
    </div>
    <script src="js/modelo.js"></script>
    <script src="js/informe.js"></script>
</body>
</html>
