<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado del Plan - Plan de Igualdad</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div style="display:flex; justify-content:space-between; align-items:center; width:100%; flex-wrap: wrap;">
                <h1>📋 Gestor de Plan de Igualdad</h1>
                
                <!-- Botón hamburguesa (solo móvil) -->
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menú">☰</button>
            </div>

            <!-- Contenedor de la navegación que se colapsa en móvil -->
            <div class="nav-container" id="navContainer">
                <div class="header-tools">
                    <div class="demo-badge" id="demoBadge" style="display:none;" title="Los datos actuales son de ejemplo. Se quitará al guardar datos propios.">
                        🎭 Modo DEMO
                    </div>
                    <div class="user-selector" id="userSelector">
                        <span class="user-label">👤 Trabajando como:</span>
                        <select id="usuarioActualSelect" title="Selecciona quién está trabajando">
                            <option value="">— Selecciona —</option>
                        </select>
                    </div>
                </div>
                
                <nav id="mainNav"></nav>
            </div>
        </div>
    </header>

    <main class="container">
<section class="page-title" style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div>
                <h2>📈 Estado del Plan</h2>
                <p>Define las acciones concretas (medidas) para corregir los hallazgos y alcanzar la igualdad.</p>
            </div>
            <button type="button" class="btn btn-primary" id="btnNuevaMedida">➕ Nueva Medida</button>
        </section>

        <div class="tabla-medidas-container" style="background: #fff; border-radius: 12px; box-shadow: var(--shadow); overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead style="background: var(--bg); border-bottom: 2px solid var(--border);">
                    <tr>
                        <th style="padding: 1rem;">Objetivo / Medida</th>
                        <th style="padding: 1rem;">Plazo</th>
                        <th style="padding: 1rem;">Prioridad</th>
                        <th style="padding: 1rem;">Presupuesto</th>
                        <th style="padding: 1rem;">Responsable</th>
                        <th style="padding: 1rem;">Estado</th>
                        <th style="padding: 1rem;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaMedidasBody">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>

        <!-- Modal para añadir/editar medida -->
        <div id="modalMedida" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
            <div style="background:#fff; padding:2rem; border-radius:12px; width:100%; max-width:600px; box-shadow:var(--shadow);">
                <h3 style="margin-bottom:1.5rem; color:var(--primary-dark);" id="modalTitulo">Añadir Medida</h3>
                
                <form id="formMedida">
                    <input type="hidden" id="medidaId">
                    
                    <div class="form-group" style="margin-bottom:1rem;">
                        <label>Objetivo / Medida (Qué vamos a hacer)</label>
                        <input type="text" id="medidaTitulo" required placeholder="Ej: Implantar un protocolo de selección ciega">
                    </div>

                    <div class="form-grid" style="margin-bottom:1rem;">
                        <div class="form-group">
                            <label>Plazo (Fecha límite)</label>
                            <input type="date" id="medidaPlazo">
                        </div>
                        <div class="form-group">
                            <label>Prioridad</label>
                            <select id="medidaPrioridad">
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Presupuesto (€)</label>
                            <input type="number" id="medidaPresupuesto" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>Responsable</label>
                            <select id="medidaResponsable">
                                <option value="">— Selecciona —</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Estado de la medida</label>
                            <select id="medidaEstado">
                                <option value="pendiente">Pendiente</option>
                                <option value="en_curso">En curso</option>
                                <option value="hecho">Hecho</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom:1.5rem;">
                        <label>Indicador de seguimiento (Cómo mediremos si funciona)</label>
                        <input type="text" id="medidaIndicador" placeholder="Ej: Nº de mujeres contratadas en puestos técnicos">
                    </div>

                    <div style="display:flex; justify-content:flex-end; gap:1rem;">
                        <button type="button" class="btn btn-danger" id="btnCancelarMedida" style="background:#ccc;">Cancelar</button>
                        <button type="submit" class="btn btn-primary">💾 Guardar Medida</button>
                    </div>
                </form>
            </div>
        </div>
</main>

    <footer class="main-footer">
        <p>&copy; 2026 Gestor de Plan de Igualdad</p>
    </footer>

    <script src="js/archivos-db.js"></script>
    <script src="js/modelo.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/seed-loader.js"></script>
    <script src="js/usuario-selector.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/estado.js"></script>
    <script src="js/toast.js"></script>
</body>
</html>
