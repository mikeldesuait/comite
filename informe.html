<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe del Plan de Igualdad</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos especiales para impresión */
        @media print {
            body { background: #fff; font-size: 12px; color: #000; }
            .no-print { display: none !important; }
            .container { max-width: 100%; padding: 0; }
            .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
            h1, h2, h3 { color: #000 !important; }
            .fase-header { background: #eee !important; color: #000 !important; -webkit-print-color-adjust: exact; }
            .estado-badge { border: 1px solid #000; color: #000 !important; background: none !important; }
        }
        .header-print { text-align: center; margin-bottom: 2rem; border-bottom: 2px solid var(--primary); padding-bottom: 1rem; }
        .header-print h1 { color: var(--primary-dark); margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="container" style="margin-top: 2rem; margin-bottom: 2rem;">
        
        <!-- Barra de acciones (no se imprime) -->
        <div class="no-print" style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
            <a href="index.html" class="btn" style="background: #757575;">⬅️ Volver al inicio</a>
            <button onclick="window.print()" class="btn btn-primary">🖨️ Imprimir / Guardar como PDF</button>
        </div>

        <!-- Contenido del informe -->
        <div id="informeContenido">
            <!-- Se llena con JS -->
        </div>

    </div>

    <script src="js/modelo.js"></script>
    <script src="js/informe.js"></script>
</body>
</html>
